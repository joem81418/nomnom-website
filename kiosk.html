<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nomnom Kiosk — Canteen Self-Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4ecd3; --bg-alt:#e9dcb8; --panel:#fffdf7; --panel-2:#f7ecd6;
  --line:rgba(40,28,8,0.14); --text:#2A2013; --text-dim:#8a7a5c;
  --blue:#fdab01; --blue-bright:#b8860b; --blue-deep:#8a5c00;
  --green:#1E9E64; --amber:#D9730D; --red:#E5484D;
  --radius:18px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:radial-gradient(circle at 20% 0%, #fff7e6 0%, var(--bg) 55%);
  color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;min-height:100dvh;overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:-0.01em;line-height:1.08;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

/* ---- topbar ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 28px;border-bottom:1px solid var(--line);
  background:rgba(255,253,246,0.8);backdrop-filter:blur(6px);
  position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-badge{
  width:42px;height:42px;border-radius:11px;
  background:var(--panel);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 6px 18px rgba(253,171,1,0.35);
}
.brand-badge img{width:100%;height:100%;object-fit:contain;padding:4px;}
.brand-titles .name{font-size:16px;}
.brand-titles .full{font-family:'JetBrains Mono';font-size:9.5px;color:var(--text-dim);letter-spacing:.03em;max-width:340px;line-height:1.4;margin-top:2px;}
.status-pill{
  font-family:'JetBrains Mono';font-size:11px;padding:6px 12px;border-radius:999px;
  border:1px solid var(--line);display:flex;align-items:center;gap:6px;color:var(--text-dim);
}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.status-pill.closed .dot{background:var(--red);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.suggest-btn{
  font-family:'Inter',sans-serif;font-size:12px;font-weight:700;color:var(--amber);
  background:rgba(217,115,13,0.1);border:1px solid rgba(217,115,13,0.35);
  border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:6px;
}

main.screen{flex:1;display:flex;flex-direction:column;}
.wrap{max-width:1120px;margin:0 auto;width:100%;padding:0 24px;}
.center{align-items:center;justify-content:center;text-align:center;}

/* ---- Menu announcement ---- */
.menu-announce{
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;font-size:12.5px;color:var(--amber);
  margin-bottom:14px;
}
.closed-banner{background:rgba(229,72,77,0.1);border:1px solid rgba(229,72,77,0.35);color:var(--red);border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;margin-bottom:18px;}

/* ---- Category nav + menu ---- */
.menu-top{padding:22px 24px 0;}
.menu-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap;}
.menu-top-row h2{font-size:18px;margin:0;}
.menu-clock{font-size:14px;color:var(--text-dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;}
.search-wrap{position:relative;margin-bottom:14px;}
.search-input{width:100%;padding:12px 42px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;}
.search-input::placeholder{color:#a89a7c;}
.search-input:focus{outline:none;border-color:var(--blue);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;pointer-events:none;}
.search-clear{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:var(--panel-2);border:1px solid var(--line);color:var(--text-dim);width:24px;height:24px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0;}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px;}
.cats::-webkit-scrollbar{display:none;}
.cats button{
  background:var(--panel);border:1px solid var(--line);color:var(--text-dim);
  padding:11px 18px;border-radius:12px;font-weight:700;font-size:13.5px;white-space:nowrap;
}
.cats button.active{background:var(--blue);border-color:var(--blue);color:white;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:6px 24px 140px;max-width:1120px;margin:0 auto;width:100%;}
.item-card{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;transition:transform .12s ease, border-color .12s ease;
}
.item-card:hover{transform:translateY(-3px);border-color:var(--blue-deep);}
.item-img{height:112px;display:flex;align-items:center;justify-content:center;font-size:42px;background:linear-gradient(160deg,var(--panel-2),var(--panel));position:relative;overflow:hidden;}
.item-img img{width:100%;height:100%;object-fit:cover;display:block;}
.item-badge{position:absolute;top:9px;left:9px;background:var(--blue);color:white;font-family:'JetBrains Mono';font-size:9.5px;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
.item-badge.unavail{background:var(--red);}
.item-body{padding:13px 14px 15px;display:flex;flex-direction:column;gap:5px;flex:1;}
.item-body .name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.inline-badge{font-family:'JetBrains Mono';font-size:9px;background:var(--blue);color:white;padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;font-weight:700;}
.inline-badge.unavail{background:var(--red);}
.item-body .desc{font-size:12px;color:var(--text-dim);line-height:1.4;min-height:30px;}
.item-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.price{font-family:'JetBrains Mono';font-weight:700;font-size:14.5px;color:var(--blue-bright);}
.add-btn{background:var(--blue);color:white;border:none;border-radius:9px;width:34px;height:34px;font-size:19px;font-weight:700;}
.add-btn:disabled{background:var(--panel-2);color:var(--text-dim);cursor:not-allowed;}
.stepper{display:flex;align-items:center;gap:9px;}
.stepper button{background:var(--panel-2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:28px;height:28px;font-weight:700;}
.stepper .qty{font-family:'JetBrains Mono';font-weight:700;min-width:16px;text-align:center;}

/* ---- Cart bar (sticky bottom on menu) ---- */
.cartbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:rgba(255,253,246,0.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.cartbar-info{display:flex;align-items:center;gap:14px;}
.cartbar-count{background:var(--blue);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono';font-weight:700;}
.cartbar-total{font-family:'JetBrains Mono';font-weight:700;font-size:17px;}
.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:white;border:none;
  border-radius:12px;padding:14px 26px;font-weight:800;font-size:14.5px;font-family:'Poppins';
  box-shadow:0 8px 22px rgba(253,171,1,0.35);
}
.btn-primary:disabled{opacity:.4;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:12px;padding:12px 22px;font-weight:700;font-size:14px;}
.btn-danger{background:transparent;border:1.5px solid var(--red);color:var(--red);border-radius:12px;padding:12px 22px;font-weight:700;font-size:14px;}
.btn-danger:disabled{opacity:.35;cursor:not-allowed;}

/* ---- Cart / Checkout screens ---- */
.page{max-width:640px;margin:0 auto;width:100%;padding:34px 24px 60px;}
.page-head{margin-bottom:22px;}
.page-head .step{font-family:'JetBrains Mono';font-size:11px;color:var(--blue-bright);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
.cart-line{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);}
.cart-line .em{font-size:28px;width:44px;text-align:center;}
.cart-line .info{flex:1;}
.cart-line .info .n{font-weight:700;font-size:14.5px;}
.cart-line .info .p{font-family:'JetBrains Mono';font-size:12px;color:var(--text-dim);}
.empty{text-align:center;color:var(--text-dim);padding:60px 20px;font-size:14px;}
.summary-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:18px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:var(--text-dim);}
.summary-row.total{color:var(--text);font-weight:800;font-size:17px;margin-top:8px;}
.actions-row{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;}

.field{margin-bottom:16px;}
.field label{font-size:12.5px;font-weight:700;display:block;margin-bottom:7px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{
  width:100%;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--text);font-size:14.5px;
}
.field textarea{resize:vertical;min-height:130px;font-family:inherit;}
.field input::placeholder,.field textarea::placeholder{color:#a89a7c;}
/* ---- Confirmation ---- */
.ticket-card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px 26px;text-align:center;position:relative;overflow:hidden;}
.ticket-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--blue),var(--blue-bright));}
.ticket-num{font-family:'JetBrains Mono';font-size:clamp(34px,10vw,52px);font-weight:700;color:var(--blue-bright);margin:12px 0 6px;letter-spacing:.02em;}
.ticket-sub{font-family:'JetBrains Mono';font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;}
.tracker{display:flex;justify-content:space-between;margin:30px 0 22px;position:relative;}
.tracker::before{content:"";position:absolute;top:14px;left:24px;right:24px;height:2px;background:var(--line);z-index:0;}
.tstep{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
.tstep .circ{width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;}
.tstep.done .circ{background:var(--blue);border-color:var(--blue);}
.tstep.current .circ{background:var(--blue-bright);border-color:var(--blue-bright);box-shadow:0 0 0 5px rgba(184,134,11,0.35);}
.tstep .lbl{font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono';text-align:center;}
.tstep.done .lbl,.tstep.current .lbl{color:var(--text);}
.cancelled-banner{background:rgba(229,72,77,0.1);border:1px solid rgba(229,72,77,0.35);color:var(--red);border-radius:12px;padding:16px;font-weight:700;margin:20px 0;}
.order-items{text-align:left;background:var(--bg-alt);border-radius:14px;padding:14px 16px;margin:20px 0;}
.order-items .oi{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;color:var(--text-dim);}
.order-items hr{border:none;border-top:1px dashed var(--line);margin:8px 0;}
.order-items .ot{display:flex;justify-content:space-between;font-weight:800;color:var(--text);}
.eta-line{font-size:13px;color:var(--green);font-weight:700;margin-bottom:6px;}

footer.kfoot{text-align:center;padding:24px;color:var(--text-dim);font-family:'JetBrains Mono';font-size:10.5px;border-top:1px solid var(--line);}

/* ================= RESPONSIVE ================= */
/* Tablet and below: tighten spacing, let the topbar wrap instead of squeezing */
@media(max-width:900px){
  .topbar{padding:14px 18px;flex-wrap:wrap;row-gap:10px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding:6px 18px 130px;}
  .menu-top{padding:18px 18px 0;}
  .page{padding:28px 18px 60px;}
}

/* Phones: single-column rhythm, larger tap targets, no wasted chrome */
@media(max-width:640px){
  .tracker .lbl{display:none;}
  .topbar{padding:12px 14px;}
  .brand{gap:9px;}
  .brand-badge{width:36px;height:36px;font-size:13px;}
  .brand-titles .name{font-size:14px;}
  .brand-titles .full{max-width:220px;font-size:8.5px;}
  .suggest-btn{padding:7px 11px;font-size:11px;}
  .suggest-btn span.lbl-full{display:none;}
  .status-pill{padding:5px 10px;font-size:10px;}
  .menu-top-row{gap:8px;}
  .menu-top-row h2{font-size:16px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;padding:4px 14px 150px;}
  .item-img{height:92px;font-size:34px;}
  .cartbar{padding:13px 16px;}
  .cartbar-total{font-size:15px;}
  .btn-primary,.btn-ghost,.btn-danger{padding:12px 18px;font-size:13.5px;}
  .page{padding:22px 14px 50px;max-width:100%;}
  .actions-row{flex-direction:column;}
  .actions-row button{width:100%;}
  .ticket-card{padding:26px 18px;}
}

/* Very small phones */
@media(max-width:380px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));}
  .brand-titles .full{display:none;}
}
</style>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>

<body>
<div id="app"></div>

<script>
/* ================= STORAGE HELPERS ================= */
const KEYS = { orders:'scp_orders', menu:'scp_menu', settings:'scp_settings', suggestions:'scp_suggestions' };

const DEFAULT_MENU = [
  {id:1,cat:"Rice Meals",name:"Chicken Adobo Rice",desc:"Soy-vinegar braised chicken over rice.",price:55,emoji:"🍗",badge:"Bestseller",available:true},
  {id:2,cat:"Rice Meals",name:"Beef Sinigang Rice",desc:"Sour tamarind broth, beef & veggies.",price:65,emoji:"🍲",available:true},
  {id:3,cat:"Rice Meals",name:"Tapsilog",desc:"Beef tapa, garlic rice, fried egg.",price:60,emoji:"🍳",available:true},
  {id:4,cat:"Rice Meals",name:"Pork Menudo Rice",desc:"Diced pork & liver stew with rice.",price:58,emoji:"🍛",available:true},
  {id:5,cat:"Noodles",name:"Pancit Bihon",desc:"Stir-fried rice noodles with veggies.",price:40,emoji:"🍜",badge:"Bestseller",available:true},
  {id:6,cat:"Noodles",name:"Sotanghon Soup",desc:"Glass noodle soup with chicken.",price:38,emoji:"🥣",available:true},
  {id:7,cat:"Snacks",name:"Siomai (4pcs)",desc:"Steamed pork dumplings, soy-calamansi.",price:35,emoji:"🥟",available:true},
  {id:8,cat:"Snacks",name:"Kwek-kwek (5pcs)",desc:"Orange-battered quail eggs, vinegar dip.",price:30,emoji:"🍢",available:true},
  {id:9,cat:"Snacks",name:"Cheese Sticks (5pcs)",desc:"Crispy fried cheese spring rolls.",price:25,emoji:"🧀",available:true},
  {id:10,cat:"Snacks",name:"Turon (2pcs)",desc:"Caramelized banana spring rolls.",price:20,emoji:"🍌",available:true},
  {id:11,cat:"Drinks",name:"Buko Juice",desc:"Fresh young coconut water.",price:25,emoji:"🥥",available:true},
  {id:12,cat:"Drinks",name:"Iced Tea",desc:"House-blend sweet iced tea.",price:15,emoji:"🧊",available:true},
  {id:13,cat:"Drinks",name:"Sago't Gulaman",desc:"Brown sugar syrup, sago & gelatin.",price:20,emoji:"🥤",available:true},
  {id:14,cat:"Desserts",name:"Halo-Halo",desc:"Shaved ice, mixed sweets, leche flan, ube.",price:45,emoji:"🍧",badge:"Bestseller",available:true},
  {id:15,cat:"Desserts",name:"Leche Flan Cup",desc:"Creamy caramel custard.",price:25,emoji:"🍮",available:true},
];
const DEFAULT_SETTINGS = {storeOpen:true, ticketCounter:14, announcement:''};

/* ================= STORAGE (Firebase Realtime Database) ================= */
// Paste your Firebase project's config below (Firebase Console → Project
// settings → General → Your apps → SDK setup and configuration).
// This SAME config object must be pasted into all four files (kiosk.html,
// admin.html, staff-display.html, tv-display.html) so they all read/write
// the same database.
const firebaseConfig = {
  apiKey: "AIzaSyB5Z9A_YAp6ClzJgbq-UkR8X0_XLQxmWtw",
  authDomain: "scp-website-af585.firebaseapp.com",
  databaseURL: "https://scp-website-af585-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "scp-website-af585",
  storageBucket: "scp-website-af585.firebasestorage.app",
  messagingSenderId: "232141944184",
  appId: "1:232141944184:web:fbae0b26fac4367152848d",
  measurementId: "G-4ZXSR4B78P"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const DB_ROOT = 'scp'; // all canteen data lives under this node

async function kvGet(key){
  try{
    const snap = await db.ref(DB_ROOT + '/' + key).get();
    return snap.exists() ? snap.val() : null;
  }catch(e){ console.error('Firebase read failed:', e); return null; }
}
async function kvSet(key, value){
  try{ await db.ref(DB_ROOT + '/' + key).set(value); }
  catch(e){ console.error('Firebase write failed:', e); }
}

async function loadOrders(){
  const v = await kvGet(KEYS.orders);
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function saveOrders(orders){
  await kvSet(KEYS.orders, JSON.stringify(orders));
}
async function loadMenu(){
  const v = await kvGet(KEYS.menu);
  if(v){ try{ return JSON.parse(v); }catch(e){} }
  await saveMenuSilent(DEFAULT_MENU);
  return DEFAULT_MENU;
}
async function saveMenuSilent(menu){
  await kvSet(KEYS.menu, JSON.stringify(menu));
}
async function loadSettings(){
  const v = await kvGet(KEYS.settings);
  if(v){ try{ return JSON.parse(v); }catch(e){} }
  await saveSettingsSilent(DEFAULT_SETTINGS);
  return DEFAULT_SETTINGS;
}
async function saveSettingsSilent(s){
  await kvSet(KEYS.settings, JSON.stringify(s));
}
async function loadSuggestions(){
  const v = await kvGet(KEYS.suggestions);
  try{ return v ? JSON.parse(v) : []; }catch(e){ return []; }
}
async function saveSuggestions(s){
  await kvSet(KEYS.suggestions, JSON.stringify(s));
}

// Instant refresh on ANY device the moment data changes in Firebase, instead
// of waiting for the next poll. This fires very often — every order placed
// or updated by anyone, anywhere — so if someone is in the middle of typing
// their name, section, or a suggestion, a full re-render would destroy that
// input element and dismiss the mobile keyboard mid-keystroke. isTypingInApp()
// guards against that: we simply skip this background refresh while the
// person is actively focused in a text field, and pick the fresh data up on
// the next tick once they're done.
function isTypingInApp(){
  const el = document.activeElement;
  const app = document.getElementById('app');
  return !!(el && app && app.contains(el) && (el.tagName==='INPUT' || el.tagName==='TEXTAREA'));
}
db.ref(DB_ROOT).on('value', ()=>{
  if(typeof render === 'function' && !isTypingInApp()) render();
});

/* ================= STATE ================= */
let MENU = [];
let SETTINGS = {...DEFAULT_SETTINGS};
let activeCat = "All";
let searchQuery = "";
let cart = {};
let customer = { name:'', section:'' };
let currentOrderId = null;
let isPlacingOrder = false;
let lastPlacedOrder = null;

function cartEntries(){ return Object.entries(cart).map(([id,qty])=>({item:MENU.find(m=>m.id==id), qty})).filter(e=>e.item); }
function cartTotal(){ return cartEntries().reduce((s,e)=>s+e.item.price*e.qty,0); }
function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function money(n){ return '₱'+n; }
function startOrder(){ cart={}; customer={name:'',section:''}; currentOrderId=null; lastKioskOrderStatus=null; activeCat="All"; searchQuery=''; nav('/menu'); }

/* ================= ROUTER ================= */
function nav(route){ location.hash = route; }
window.addEventListener('hashchange', render);

function currentRoute(){ return location.hash.replace('#','') || '/'; }

// Tracks the last route we actually rendered so we can tell a real
// navigation (user tapped a link/button, or the hash changed) apart from a
// re-render triggered in the background (Firebase data change, the polling
// interval, typing in search, etc). We only want to jump to the top of the
// page on real navigation — otherwise a background refresh would yank the
// page back to the top while someone is mid-scroll, which is the bug this
// fixes.
let lastRenderedRoute = null;
async function render(){
  const route = currentRoute();
  const navigated = route !== lastRenderedRoute;
  lastRenderedRoute = route;
  const app = document.getElementById('app');
  if(route === '/menu' || route === '/') app.innerHTML = screenMenu();
  else if(route === '/cart') app.innerHTML = screenCart();
  else if(route === '/checkout') app.innerHTML = screenCheckout();
  else if(route === '/suggest') app.innerHTML = screenSuggest();
  else if(route === '/kiosk/confirm'){ app.innerHTML = shell(`<div class="page center" style="padding-top:100px;"><p class="mono" style="color:var(--text-dim);">Loading your order…</p></div>`); await renderConfirm(); }
  else app.innerHTML = screenMenu();
  tickKioskClock();
  if(navigated) window.scrollTo(0,0);
}

function shell(inner, opts={}){
  const pillClass = SETTINGS.storeOpen ? '' : 'closed';
  return `
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge"><img src="logo.png" alt="Nomnom Canteen logo"></div>
      <div class="brand-titles">
        <div class="name display">Nomnom — Canteen Self-Order Kiosk</div>
        <div class="full">NOMNOM: A SYSTEMATIC CANTEEN SUPPLY CHAIN MANAGEMENT PROCESS TO INCREASE EFFICIENCY IN THE CANTEEN</div>
      </div>
    </div>
    <div class="topbar-right">
      <button class="suggest-btn" onclick="nav('/suggest')">💡 <span class="lbl-full">Suggest something</span></button>
      <div class="status-pill ${pillClass}"><span class="dot"></span>${SETTINGS.storeOpen ? 'Open for orders' : 'Currently closed'}</div>
    </div>
  </div>
  <main class="screen">${inner}</main>
  <footer class="kfoot">LAS PIÑAS CITY NATIONAL SENIOR HIGH SCHOOL — TALON DOS CAMPUS · RESEARCH PROTOTYPE</footer>
  `;
}

/* ================= MENU ================= */
const CATS = ["All","Rice Meals","Noodles","Snacks","Drinks","Desserts"];

function screenMenu(){
  const q = searchQuery.trim().toLowerCase();
  const items = MENU.filter(i =>
    (activeCat==="All" || i.cat===activeCat) &&
    (!q || i.name.toLowerCase().includes(q) || (i.desc||'').toLowerCase().includes(q) || i.cat.toLowerCase().includes(q))
  );
  const cards = items.map(item=>{
    const qty = cart[item.id]||0;
    const unavailable = item.available===false;
    const hasImage = !!item.image;
    return `
    <div class="item-card">
      ${hasImage ? `
      <div class="item-img">
        ${item.badge && !unavailable ? `<div class="item-badge">${escapeHtml(item.badge)}</div>` : ''}
        ${unavailable ? `<div class="item-badge unavail">Sold out</div>` : ''}
        <img src="${item.image}" alt="${escapeAttr(item.name)}">
      </div>` : ''}
      <div class="item-body">
        <div class="name">
          ${escapeHtml(item.name)}
          ${!hasImage && item.badge && !unavailable ? `<span class="inline-badge">${escapeHtml(item.badge)}</span>` : ''}
          ${!hasImage && unavailable ? `<span class="inline-badge unavail">Sold out</span>` : ''}
        </div>
        <div class="desc">${escapeHtml(item.desc||'')}</div>
        <div class="item-foot">
          <div class="price">${money(item.price)}</div>
          ${unavailable ? `<button class="add-btn" disabled>+</button>` :
            qty===0
            ? `<button class="add-btn" onclick="addItem(${item.id})">+</button>`
            : `<div class="stepper"><button onclick="decItem(${item.id})">−</button><div class="qty">${qty}</div><button onclick="addItem(${item.id})">+</button></div>`
          }
        </div>
      </div>
    </div>`;
  }).join('');

  return shell(`
    <div class="menu-top wrap">
      ${!SETTINGS.storeOpen ? `<div class="closed-banner">⚠ The canteen is currently closed. You can browse the menu, but ordering is unavailable right now.</div>` : ''}
      ${SETTINGS.announcement ? `<div class="menu-announce">📣 ${escapeHtml(SETTINGS.announcement)}</div>` : ''}
      <div class="menu-top-row">
        <h2 class="display">Today's Menu</h2>
        <div class="menu-clock mono" id="menuClock">--:--:--</div>
      </div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Search for food…" value="${escapeAttr(searchQuery)}" oninput="onSearchInput(this.value)">
        ${searchQuery ? `<button class="search-clear" onclick="clearSearch()">✕</button>` : ''}
      </div>
      <div class="cats">
        ${CATS.map(c=>`<button class="${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
      </div>
    </div>
    <div class="grid">${cards || `<div class="empty">${searchQuery ? `No items match "${escapeHtml(searchQuery)}".` : 'No items in this category.'}</div>`}</div>
    ${cartCount()>0 ? `
    <div class="cartbar">
      <div class="cartbar-info">
        <div class="cartbar-count">${cartCount()}</div>
        <div class="cartbar-total mono">${money(cartTotal())}</div>
      </div>
      <button class="btn-primary" ${!SETTINGS.storeOpen ? 'disabled' : ''} onclick="nav('/cart')">View Cart →</button>
    </div>` : ''}
  `);
}
function setCat(c){ activeCat=c; render(); }
function onSearchInput(v){
  searchQuery = v;
  render();
  // render() rebuilds the DOM, which drops focus — restore it so typing feels continuous.
  const el = document.getElementById('searchInput');
  if(el){ el.focus(); const pos = el.value.length; el.setSelectionRange(pos,pos); }
}
function clearSearch(){ searchQuery=''; render(); }
function addItem(id){ cart[id]=(cart[id]||0)+1; render(); }
function decItem(id){ if(!cart[id])return; cart[id]-=1; if(cart[id]<=0) delete cart[id]; render(); }

/* ================= CART ================= */
function screenCart(){
  const entries = cartEntries();
  const lines = entries.map(e=>`
    <div class="cart-line">
      <div class="em">${e.item.emoji}</div>
      <div class="info">
        <div class="n">${escapeHtml(e.item.name)}</div>
        <div class="p mono">${money(e.item.price)} × ${e.qty}</div>
      </div>
      <div class="stepper"><button onclick="decItem(${e.item.id});render()">−</button><div class="qty">${e.qty}</div><button onclick="addItem(${e.item.id});render()">+</button></div>
    </div>
  `).join('');

  return shell(`
    <div class="page">
      <div class="page-head"><div class="step">Step 1 of 3</div><h2>Your Cart</h2></div>
      ${!SETTINGS.storeOpen ? `<div class="closed-banner">⚠ The canteen is currently closed. Ordering is unavailable right now.</div>` : ''}
      ${entries.length===0 ? `<div class="empty">Your cart is empty.<br><br><button class="btn-ghost" onclick="nav('/menu')">← Back to Menu</button></div>` : `
        ${lines}
        <div class="summary-box">
          <div class="summary-row"><span>Subtotal</span><span class="mono">${money(cartTotal())}</span></div>
          <div class="summary-row total"><span>Total</span><span class="mono">${money(cartTotal())}</span></div>
        </div>
        <div class="actions-row">
          <button class="btn-primary" ${!SETTINGS.storeOpen ? 'disabled' : ''} onclick="nav('/checkout')">Proceed to Checkout</button>
          <button class="btn-ghost" onclick="nav('/menu')">Add More Items</button>
          <button class="btn-danger" onclick="clearCart()">Cancel Order</button>
        </div>
      `}
    </div>
  `);
}
function clearCart(){ if(confirm('Remove all items and cancel this order?')){ cart={}; nav('/menu'); } }

/* ================= CHECKOUT ================= */
const SECTIONS = [
  "Grade 11 - Accountability",
  "Grade 11 - Blessedness",
  "Grade 11 - Compassionate",
  "Grade 12 - Discipline",
  "Grade 12 - Fidelity",
  "Grade 12 - Empathy"
];

function screenCheckout(){
  if(cartCount()===0){ return shell(`<div class="page empty">Your cart is empty.<br><br><button class="btn-ghost" onclick="nav('/menu')">← Back to Menu</button></div>`); }
  if(!SETTINGS.storeOpen){
    return shell(`<div class="page center" style="padding-top:60px;">
      <div class="closed-banner" style="margin-bottom:18px;">⚠ The canteen is currently closed. Ordering is unavailable right now.</div>
      <button class="btn-primary" onclick="nav('/cart')">← Back to Cart</button>
    </div>`);
  }
  return shell(`
    <div class="page">
      <div class="page-head"><div class="step">Step 2 of 3</div><h2>Checkout</h2></div>

      <div class="field"><label>Full name</label><input type="text" id="custName" value="${escapeAttr(customer.name)}" placeholder="Juan Dela Cruz"></div>
      <div class="field">
        <label>Grade & section</label>
        <select id="custSection">
          <option value="" ${customer.section===''?'selected':''} disabled>Select grade & section</option>
          ${SECTIONS.map(s=>`<option value="${escapeAttr(s)}" ${s===customer.section?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>

      <div class="summary-box">
        <div class="summary-row total"><span>Total</span><span class="mono">${money(cartTotal())}</span></div>
      </div>

      <div class="actions-row">
        <button class="btn-primary" onclick="goPay()">Place Order (Pay with Cash)</button>
        <button class="btn-ghost" onclick="nav('/cart')">← Back to Cart</button>
      </div>
    </div>
  `);
}
function syncCheckoutInputs(){
  const n = document.getElementById('custName'); if(n) customer.name = n.value;
  const s = document.getElementById('custSection'); if(s) customer.section = s.value;
}
function goPay(){
  if(isPlacingOrder) return;
  if(!SETTINGS.storeOpen){ alert('The canteen is currently closed. Ordering is unavailable right now.'); render(); return; }
  syncCheckoutInputs();
  if(!customer.name.trim()){ alert('Please enter your name.'); return; }
  if(!customer.section){ alert('Please select your grade & section.'); return; }
  placeOrder('Cash', false);
}

/* ================= SUGGESTIONS ================= */
function screenSuggest(){
  return shell(`
    <div class="page" style="max-width:560px;">
      <div class="page-head"><div class="step">Feedback</div><h2>Suggest something</h2></div>
      <p style="color:var(--text-dim);font-size:13.5px;line-height:1.6;margin:0 0 20px;">Got an idea for a new dish, feedback on the queue, or something you'd like the canteen to improve? Write it below and it'll go straight to the canteen staff.</p>
      <div class="field"><label>Your name (optional)</label><input type="text" id="suggestName" placeholder="Juan Dela Cruz"></div>
      <div class="field"><label>Your suggestion</label><textarea id="suggestText" rows="6" placeholder="Type your suggestion here…"></textarea></div>
      <div class="actions-row">
        <button class="btn-primary" onclick="submitSuggestion()">Send Suggestion</button>
        <button class="btn-ghost" onclick="nav('/')">Cancel</button>
      </div>
    </div>
  `);
}
async function submitSuggestion(){
  const textEl = document.getElementById('suggestText');
  const nameEl = document.getElementById('suggestName');
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ alert('Please write your suggestion before sending.'); return; }
  const name = nameEl ? nameEl.value.trim() : '';
  const suggestions = await loadSuggestions();
  suggestions.push({
    id: 'sug_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    name: name || 'Anonymous',
    text,
    createdAt: Date.now()
  });
  await saveSuggestions(suggestions);
  alert('Thanks! Your suggestion has been sent to the canteen staff.');
  nav('/');
}

/* ================= PLACE ORDER ================= */
async function placeOrder(method, verified){
  if(isPlacingOrder) return;
  isPlacingOrder = true;
  try{
    const settings = await loadSettings();
    SETTINGS = settings;
    if(!settings.storeOpen){
      alert('The canteen just closed. Your order was not placed.');
      render();
      return;
    }
    settings.ticketCounter = (settings.ticketCounter || 14) + 1;
    await saveSettingsSilent(settings);
    SETTINGS = settings;
    const ticket = 'B-' + String(settings.ticketCounter).padStart(3,'0');
    const entries = cartEntries();
    const total = cartTotal();
    const order = {
      id: 'ord_' + Date.now() + '_' + Math.floor(Math.random()*1000),
      ticket,
      items: entries.map(e=>({id:e.item.id, name:e.item.name, price:e.item.price, qty:e.qty, emoji:e.item.emoji})),
      subtotal: total,
      total,
      name: customer.name || 'Guest',
      section: customer.section || '',
      payment: { method, verified: !!verified },
      status: 'placed',
      createdAt: Date.now()
    };
    // Re-fetch immediately before writing to minimize the window for a lost update
    // if another save happens concurrently (e.g. a double-tap or another device).
    const orders = await loadOrders();
    orders.push(order);
    await saveOrders(orders);
    currentOrderId = order.id;
    lastPlacedOrder = order;
    lastKioskOrderStatus = null; // reset so renderConfirm doesn't treat this as a "just became ready" transition
    cart = {};
    playBell();
    nav('/kiosk/confirm');
  } finally {
    isPlacingOrder = false;
  }
}

/* ================= CONFIRMATION ================= */
async function findOrder(id){
  const orders = await loadOrders();
  return orders.find(o=>o.id===id);
}
async function renderConfirm(){
  const app = document.getElementById('app');
  if(!currentOrderId){
    app.innerHTML = shell(`<div class="page center" style="padding-top:80px;"><p style="color:var(--text-dim);">No active order found on this kiosk.</p><br><button class="btn-primary" onclick="nav('/')">Back to Menu</button></div>`);
    return;
  }
  let order = await findOrder(currentOrderId);
  // The order may not be visible yet right after saving (storage read-after-write lag),
  // or a concurrent save from a double-tap could momentarily race it out of the list.
  // Retry briefly before falling back to the locally cached copy, so a freshly placed
  // order never wrongly shows as "not found".
  if(!order){
    for(let attempt=0; attempt<3 && !order; attempt++){
      await new Promise(r=>setTimeout(r, 500));
      order = await findOrder(currentOrderId);
    }
  }
  if(!order && lastPlacedOrder && lastPlacedOrder.id===currentOrderId){
    order = lastPlacedOrder;
  }
  if(!order){
    app.innerHTML = shell(`<div class="page center" style="padding-top:80px;"><p style="color:var(--text-dim);">This order could not be found.</p><br><button class="btn-primary" onclick="nav('/')">Back to Menu</button></div>`);
    return;
  }
  if(lastKioskOrderStatus !== null && lastKioskOrderStatus !== 'ready' && order.status === 'ready'){
    playBell();
  }
  lastKioskOrderStatus = order.status;
  app.innerHTML = shell(buildConfirmHTML(order));
}

function buildConfirmHTML(order){
  const steps = [
    {key:'placed', label:'Order Placed', icon:'✓'},
    {key:'preparing', label:'Preparing', icon:'👨‍🍳'},
    {key:'ready', label:'Ready for Pick-up', icon:'🔔'},
  ];
  const order_status_index = steps.findIndex(s=>s.key===order.status);
  const isCancelled = order.status === 'cancelled';
  const isCompleted = order.status === 'completed';

  const trackerHTML = steps.map((s,i)=>{
    let cls = '';
    if(!isCancelled){
      if(i < order_status_index || isCompleted) cls = 'done';
      else if(i === order_status_index) cls = 'current';
    }
    return `<div class="tstep ${cls}"><div class="circ">${s.icon}</div><div class="lbl">${s.label}</div></div>`;
  }).join('');

  const canCancel = ['placed','preparing'].includes(order.status);

  const itemsHTML = order.items.map(it=>`<div class="oi"><span>${it.qty}× ${escapeHtml(it.name)}</span><span class="mono">${money(it.price*it.qty)}</span></div>`).join('');

  return `
    <div class="page" style="max-width:460px;">
      <div class="ticket-card">
        <div class="ticket-sub">${isCancelled ? 'Order Cancelled' : (isCompleted ? 'Picked Up' : 'Show this number at the counter')}</div>
        <div class="ticket-num">${order.ticket}</div>
        <div class="ticket-sub">${escapeHtml(order.name)} · ${escapeHtml(order.section||'—')}</div>

        ${isCancelled
          ? `<div class="cancelled-banner">This order has been cancelled.</div>`
          : `<div class="tracker">${trackerHTML}</div>`
        }

        <div class="order-items">
          ${itemsHTML}
          <hr>
          <div class="ot"><span>Total</span><span class="mono">${money(order.total)}</span></div>
          <div style="margin-top:8px;font-size:12px;color:var(--text-dim);">
            Cash · Pay at counter
          </div>
        </div>

        <div class="actions-row" style="justify-content:center;">
          ${!isCancelled && !isCompleted ? `<button class="btn-danger" ${canCancel ? '' : 'disabled'} onclick="cancelOrder('${order.id}')">${canCancel ? 'Cancel Order' : ('Already ' + order.status + ' \u2014 can\u2019t cancel')}</button>` : ''}
          <button class="btn-primary" onclick="startOrder()">Start New Order</button>
        </div>
      </div>
    </div>
  `;
}

async function cancelOrder(id){
  if(!confirm('Are you sure you want to cancel this order?')) return;
  const orders = await loadOrders();
  const idx = orders.findIndex(o=>o.id===id);
  if(idx===-1) return;
  if(!['placed','preparing'].includes(orders[idx].status)) { await renderConfirm(); return; }
  orders[idx].status = 'cancelled';
  await saveOrders(orders);
  await renderConfirm();
}

/* ================= UTIL ================= */
function escapeHtml(str){ return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(str){ return escapeHtml(str); }

/* ================= SOUND ALERTS ================= */
// Synthesized two-note chime (no external audio file needed). Browsers block
// audio until the page has seen at least one user interaction, so we grab
// the first tap anywhere on the kiosk to unlock it (normal use — ordering —
// already involves plenty of taps, so this unlocks itself almost immediately).
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
document.addEventListener('click', ensureAudio);
document.addEventListener('touchstart', ensureAudio);

function playBell(){
  const ctx = ensureAudio();
  if(!ctx) return;
  const now = ctx.currentTime;
  [880, 1318.51].forEach((freq, i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const t0 = now + i*0.16;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.35, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.55);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+0.6);
  });
}

// The kiosk only needs to track the single order the current customer is
// looking at (not the whole board), so this remembers its last-seen status
// to detect the moment it flips to "ready".
let lastKioskOrderStatus = null;

/* ================= INIT & POLLING ================= */
function tickKioskClock(){
  const el = document.getElementById('menuClock');
  if(el) el.textContent = new Date().toLocaleTimeString('en-PH', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function init(){
  MENU = await loadMenu();
  SETTINGS = await loadSettings();
  await render();
  tickKioskClock();
  setInterval(tickKioskClock, 1000);
  setInterval(async ()=>{
    // keep settings (store open/closed, announcement) and menu items fresh
    SETTINGS = await loadSettings();
    if(isTypingInApp()) return;
    if(currentRoute()==='/kiosk/confirm') await renderConfirm();
    if(currentRoute()==='/' || currentRoute()==='/menu'){ MENU = await loadMenu(); render(); }
  }, 3000);
}
init();
</script>
